[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Local-first quantitative research, backtesting and paper-trading platform (research/simulation only; no live trading)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal research use" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=15",
  "duckdb>=1.0",
  "plotly>=5.20",
  "streamlit>=1.46",
  "yfinance>=0.2.50",
  "exchange_calendars>=4.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
quantlab = "quantlab.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: slower end-to-end tests using offline fixtures",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
files = ["src/quantlab"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP017", "B905"]

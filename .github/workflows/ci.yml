name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      LIVE_TRADING_ENABLED: "false"
      QUANTLAB_LLM_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (offline fixtures only)
        run: pytest -q -p no:warnings -o addopts=""
      - name: Acceptance (offline)
        run: python scripts/acceptance_test.py --offline --data-dir "$RUNNER_TEMP/quantlab_acceptance"
